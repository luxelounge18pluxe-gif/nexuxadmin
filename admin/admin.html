<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - AI Tools Marketplace</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
* { font-family: 'DM Sans', sans-serif; }
html, body { height: 100%; margin: 0; }
.hide-scrollbar::-webkit-scrollbar { display: none; }
.hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.animate-fade-in { animation: fadeIn 0.3s ease-out; }
  </style>
  <style>body { box-sizing: border-box; }</style>
 </head>
 <body class="h-full text-gray-100 overflow-auto hide-scrollbar" style="background: linear-gradient(135deg, #0f1117 0%, #1a1d27 50%, #0a0e18 100%);">
  
  <!-- Admin Page -->
  <div id="adminPage" class="w-full h-full flex flex-col" style="--bg:#0f1117;--surface:#1a1d27;--text:#e2e4ea;--primary:#6c5ce7;--secondary:#a29bfe;background: linear-gradient(135deg, #0f1117 0%, #1a1d27 50%, #0a0e18 100%);">
    <header class="px-5 pt-5 pb-3 flex items-center justify-between flex-shrink-0 border-b border-opacity-10" style="border-color:var(--secondary)">
      <h1 class="text-lg font-bold" style="color:var(--text)">Admin Panel - Manage Tools</h1>
      <button id="backFromAdminBtn" class="px-4 py-2 rounded-lg text-sm font-medium" style="background:var(--surface);color:var(--secondary)">Back to Marketplace</button>
    </header>
    
    <div class="flex-1 overflow-y-auto hide-scrollbar px-8 py-8">
      <div class="max-w-4xl mx-auto">
        
        <!-- Add New Tool Form -->
        <div style="background:var(--surface)" class="p-6 rounded-lg border border-opacity-10 mb-8" style="border-color:var(--secondary)">
          <h2 style="color:var(--text)" class="text-xl font-semibold mb-6">Add New Tool</h2>
          
          <form id="addToolForm" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label style="color:var(--text)" class="block text-sm font-medium mb-1">Tool Name *</label>
                <input type="text" id="toolName" required placeholder="e.g., Wix AI" class="w-full px-3 py-2 rounded-lg text-sm" style="background:var(--bg);color:var(--text);">
              </div>
              <div>
                <label style="color:var(--text)" class="block text-sm font-medium mb-1">Price *</label>
                <input type="text" id="toolPrice" required placeholder="e.g., $300/yr" class="w-full px-3 py-2 rounded-lg text-sm" style="background:var(--bg);color:var(--text);">
              </div>
            </div>

            <div>
              <label style="color:var(--text)" class="block text-sm font-medium mb-1">Logo/Picture *</label>
              <input type="file" id="toolLogo" accept="image/*" required class="w-full px-3 py-2 rounded-lg text-sm" style="background:var(--bg);color:var(--text);">
              <div id="logoPreview" class="mt-3 hidden">
                <img id="previewImg" src="" alt="Logo Preview" style="max-width:100px;max-height:100px;border-radius:8px;">
              </div>
            </div>

            <div>
              <label style="color:var(--text)" class="block text-sm font-medium mb-1">Description *</label>
              <input type="text" id="toolDesc" required placeholder="e.g., AI-powered website builder" class="w-full px-3 py-2 rounded-lg text-sm" style="background:var(--bg);color:var(--text);">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label style="color:var(--text)" class="block text-sm font-medium mb-1">Category *</label>
                <select id="toolCategory" required class="w-full px-3 py-2 rounded-lg text-sm" style="background:var(--bg);color:var(--text);">
                  <option value="">Select Category</option>
                  <option value="Web Builder">Web Builder</option>
                  <option value="Design">Design</option>
                  <option value="Numbers">Numbers</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div>
                <label style="color:var(--text)" class="block text-sm font-medium mb-1">Rating (1-5) *</label>
                <input type="number" id="toolRating" required min="1" max="5" step="0.1" placeholder="e.g., 4.6" class="w-full px-3 py-2 rounded-lg text-sm" style="background:var(--bg);color:var(--text);">
              </div>
            </div>

            <div>
              <label style="color:var(--text)" class="block text-sm font-medium mb-1">Icon (Lucide Icon Name) *</label>
              <input type="text" id="toolIcon" required placeholder="e.g., layout, zap, code" class="w-full px-3 py-2 rounded-lg text-sm" style="background:var(--bg);color:var(--text);">
            </div>

            <div>
              <label style="color:var(--text)" class="block text-sm font-medium mb-2">Features (Add one per line) *</label>
              <textarea id="toolFeatures" required placeholder="Drag & drop&#10;AI design&#10;Mobile ready" rows="4" class="w-full px-3 py-2 rounded-lg text-sm" style="background:var(--bg);color:var(--text);"></textarea>
            </div>

            <div class="flex gap-3">
              <button type="submit" style="background:var(--primary);color:white" class="px-6 py-2 rounded-lg text-sm font-medium transition-all hover:opacity-90">Add Tool</button>
              <button type="reset" style="background:var(--surface);color:var(--secondary)" class="px-6 py-2 rounded-lg text-sm font-medium transition-all hover:opacity-90">Clear</button>
            </div>
            
            <!-- Country price editor: shown only for Numbers category -->
            <div id="countryPriceSection" class="mt-4 hidden" style="background:var(--bg);padding:12px;border-radius:8px;">
              <p style="color:var(--secondary)" class="text-sm mb-2">Since you selected <strong>Numbers</strong>, enter per-country prices below (leave blank to use default):</p>
              <div id="countryPricesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-2 max-h-64 overflow-y-auto hide-scrollbar" style="padding-right:6px"></div>
            </div>
          </form>
        </div>

        <!-- Tools List -->
        <div style="background:var(--surface)" class="p-6 rounded-lg border border-opacity-10" style="border-color:var(--secondary)">
          <h2 style="color:var(--text)" class="text-xl font-semibold mb-6">Existing Tools</h2>
          <div id="toolsList" class="space-y-3">
            <!-- Tools will be rendered here -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
const API_BASE = 'https://nexusbackend-vpu0.onrender.com';
let tools = [];
let logoDataUrl = '';
  // Country list for per-country pricing (used when Category = Numbers)
  const countryData = [
    {name:"Afghanistan",code:"AF"},{name:"Albania",code:"AL"},{name:"Algeria",code:"DZ"},{name:"Andorra",code:"AD"},{name:"Angola",code:"AO"},{name:"Argentina",code:"AR"},{name:"Armenia",code:"AM"},{name:"Australia",code:"AU"},{name:"Austria",code:"AT"},{name:"Azerbaijan",code:"AZ"},{name:"Bahamas",code:"BS"},{name:"Bahrain",code:"BH"},{name:"Bangladesh",code:"BD"},{name:"Barbados",code:"BB"},{name:"Belarus",code:"BY"},{name:"Belgium",code:"BE"},{name:"Belize",code:"BZ"},{name:"Benin",code:"BJ"},{name:"Bhutan",code:"BT"},{name:"Bolivia",code:"BO"},{name:"Bosnia and Herzegovina",code:"BA"},{name:"Botswana",code:"BW"},{name:"Brazil",code:"BR"},{name:"Brunei",code:"BN"},{name:"Bulgaria",code:"BG"},{name:"Burkina Faso",code:"BF"},{name:"Burundi",code:"BI"},{name:"Cambodia",code:"KH"},{name:"Cameroon",code:"CM"},{name:"Canada",code:"CA"},{name:"Cape Verde",code:"CV"},{name:"Central African Republic",code:"CF"},{name:"Chad",code:"TD"},{name:"Chile",code:"CL"},{name:"China",code:"CN"},{name:"Colombia",code:"CO"},{name:"Comoros",code:"KM"},{name:"Congo",code:"CG"},{name:"Costa Rica",code:"CR"},{name:"Croatia",code:"HR"},{name:"Cuba",code:"CU"},{name:"Cyprus",code:"CY"},{name:"Czech Republic",code:"CZ"},{name:"Czechia",code:"CZ"},{name:"Denmark",code:"DK"},{name:"Djibouti",code:"DJ"},{name:"Dominica",code:"DM"},{name:"Dominican Republic",code:"DO"},{name:"East Timor",code:"TL"},{name:"Ecuador",code:"EC"},{name:"Egypt",code:"EG"},{name:"El Salvador",code:"SV"},{name:"Equatorial Guinea",code:"GQ"},{name:"Eritrea",code:"ER"},{name:"Estonia",code:"EE"},{name:"Ethiopia",code:"ET"},{name:"Fiji",code:"FJ"},{name:"Finland",code:"FI"},{name:"France",code:"FR"},{name:"Gabon",code:"GA"},{name:"Gambia",code:"GM"},{name:"Georgia",code:"GE"},{name:"Germany",code:"DE"},{name:"Ghana",code:"GH"},{name:"Greece",code:"GR"},{name:"Grenada",code:"GD"},{name:"Guatemala",code:"GT"},{name:"Guinea",code:"GN"},{name:"Guinea-Bissau",code:"GW"},{name:"Guyana",code:"GY"},{name:"Haiti",code:"HT"},{name:"Honduras",code:"HN"},{name:"Hungary",code:"HU"},{name:"Iceland",code:"IS"},{name:"India",code:"IN"},{name:"Indonesia",code:"ID"},{name:"Iran",code:"IR"},{name:"Iraq",code:"IQ"},{name:"Ireland",code:"IE"},{name:"Israel",code:"IL"},{name:"Italy",code:"IT"},{name:"Jamaica",code:"JM"},{name:"Japan",code:"JP"},{name:"Jordan",code:"JO"},{name:"Kazakhstan",code:"KZ"},{name:"Kenya",code:"KE"},{name:"Kiribati",code:"KI"},{name:"Kosovo",code:"XK"},{name:"Kuwait",code:"KW"},{name:"Kyrgyzstan",code:"KG"},{name:"Laos",code:"LA"},{name:"Latvia",code:"LV"},{name:"Lebanon",code:"LB"},{name:"Lesotho",code:"LS"},{name:"Liberia",code:"LR"},{name:"Libya",code:"LY"},{name:"Liechtenstein",code:"LI"},{name:"Lithuania",code:"LT"},{name:"Luxembourg",code:"LU"},{name:"Madagascar",code:"MG"},{name:"Malawi",code:"MW"},{name:"Malaysia",code:"MY"},{name:"Maldives",code:"MV"},{name:"Mali",code:"ML"},{name:"Malta",code:"MT"},{name:"Marshall Islands",code:"MH"},{name:"Mauritania",code:"MR"},{name:"Mauritius",code:"MU"},{name:"Mexico",code:"MX"},{name:"Micronesia",code:"FM"},{name:"Moldova",code:"MD"},{name:"Monaco",code:"MC"},{name:"Mongolia",code:"MN"},{name:"Montenegro",code:"ME"},{name:"Morocco",code:"MA"},{name:"Mozambique",code:"MZ"},{name:"Myanmar",code:"MM"},{name:"Namibia",code:"NA"},{name:"Nauru",code:"NR"},{name:"Nepal",code:"NP"},{name:"Netherlands",code:"NL"},{name:"New Zealand",code:"NZ"},{name:"Nicaragua",code:"NI"},{name:"Niger",code:"NE"},{name:"Nigeria",code:"NG"},{name:"North Korea",code:"KP"},{name:"North Macedonia",code:"MK"},{name:"Norway",code:"NO"},{name:"Oman",code:"OM"},{name:"Pakistan",code:"PK"},{name:"Palau",code:"PW"},{name:"Palestine",code:"PS"},{name:"Panama",code:"PA"},{name:"Papua New Guinea",code:"PG"},{name:"Paraguay",code:"PY"},{name:"Peru",code:"PE"},{name:"Philippines",code:"PH"},{name:"Poland",code:"PL"},{name:"Portugal",code:"PT"},{name:"Qatar",code:"QA"},{name:"Romania",code:"RO"},{name:"Russia",code:"RU"},{name:"Rwanda",code:"RW"},{name:"Saint Kitts and Nevis",code:"KN"},{name:"Saint Lucia",code:"LC"},{name:"Saint Vincent and the Grenadines",code:"VC"},{name:"Samoa",code:"WS"},{name:"San Marino",code:"SM"},{name:"Sao Tome and Principe",code:"ST"},{name:"Saudi Arabia",code:"SA"},{name:"Senegal",code:"SN"},{name:"Serbia",code:"RS"},{name:"Seychelles",code:"SC"},{name:"Sierra Leone",code:"SL"},{name:"Singapore",code:"SG"},{name:"Slovakia",code:"SK"},{name:"Slovenia",code:"SI"},{name:"Solomon Islands",code:"SB"},{name:"Somalia",code:"SO"},{name:"South Africa",code:"ZA"},{name:"South Korea",code:"KR"},{name:"South Sudan",code:"SS"},{name:"Spain",code:"ES"},{name:"Sri Lanka",code:"LK"},{name:"Sudan",code:"SD"},{name:"Suriname",code:"SR"},{name:"Sweden",code:"SE"},{name:"Switzerland",code:"CH"},{name:"Syria",code:"SY"},{name:"Taiwan",code:"TW"},{name:"Tajikistan",code:"TJ"},{name:"Tanzania",code:"TZ"},{name:"Thailand",code:"TH"},{name:"Timor-Leste",code:"TL"},{name:"Togo",code:"TG"},{name:"Tonga",code:"TO"},{name:"Trinidad and Tobago",code:"TT"},{name:"Tunisia",code:"TN"},{name:"Turkey",code:"TR"},{name:"Turkmenistan",code:"TM"},{name:"Tuvalu",code:"TV"},{name:"Uganda",code:"UG"},{name:"Ukraine",code:"UA"},{name:"United Arab Emirates",code:"AE"},{name:"United Kingdom",code:"GB"},{name:"United States",code:"US"},{name:"Uruguay",code:"UY"},{name:"Uzbekistan",code:"UZ"},{name:"Vanuatu",code:"VU"},{name:"Vatican City",code:"VA"},{name:"Venezuela",code:"VE"},{name:"Vietnam",code:"VN"},{name:"Yemen",code:"YE"},{name:"Zambia",code:"ZM"},{name:"Zimbabwe",code:"ZW"}
  ];

  function getFlagEmoji(code) {
    try {
      return code.toUpperCase().split('').map(c => 127397 + c.charCodeAt()).reduce((a,b) => a + String.fromCodePoint(b), '');
    } catch (e) { return '' + code; }
  }

  function populateCountryPriceEditor() {
    const container = document.getElementById('countryPricesContainer');
    if (!container) return;
    container.innerHTML = '';
    countryData.forEach(c => {
      const row = document.createElement('div');
      row.className = 'flex items-center justify-between gap-2';
      row.innerHTML = `<div class="flex items-center gap-2"><span class="text-lg">${getFlagEmoji(c.code)}</span><span style="color:var(--text)">${c.name}</span></div><input data-code="${c.code}" placeholder="$9.99" class="px-2 py-1 rounded w-28 text-sm" style="background:var(--bg);color:var(--text);">`;
      container.appendChild(row);
    });
  }

  function showToast(message, success = true) {
    const toast = document.createElement('div');
    toast.className = 'fixed bottom-5 right-5 z-50 px-4 py-3 rounded-lg text-sm shadow-lg animate-fade-in';
    toast.style.background = success ? '#16a34a' : '#dc2626';
    toast.style.color = '#fff';
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3500);
  }

  async function apiFetch(path, options = {}) {
    const url = `${API_BASE}${path}`;
    const response = await fetch(url, options);
    if (!response.ok) {
      const errorText = await response.text();
      throw new Error(errorText || response.statusText);
    }
    return response.json();
  }

  async function loadTools() {
    try {
      tools = await apiFetch('/api/tools');
      renderToolsList();
    } catch (error) {
      console.error('Failed to load tools:', error);
      showToast('Could not load tools from backend.', false);
    }
  }

  function renderToolsList() {
    const list = document.getElementById('toolsList');
    if (!list) return;
    
    list.innerHTML = '';
    
    if (tools.length === 0) {
      list.innerHTML = '<p style="color:var(--secondary)" class="text-center py-8">No tools added yet</p>';
      return;
    }
    
    tools.forEach((tool) => {
      const toolEl = document.createElement('div');
      toolEl.style.background = 'var(--bg)';
      toolEl.className = 'p-4 rounded-lg border border-opacity-10 flex items-center justify-between';
      toolEl.style.borderColor = 'var(--secondary)';
      toolEl.innerHTML = `
        <div class="flex items-center gap-4 flex-1">
          ${tool.logo ? `<img src="${tool.logo}" alt="${tool.name}" style="width:60px;height:60px;border-radius:8px;object-fit:cover;">` : '<div style="width:60px;height:60px;border-radius:8px;background:var(--surface)"></div>'}
          <div>
            <h3 style="color:var(--text)" class="font-semibold text-sm">${tool.name}</h3>
            <p style="color:var(--secondary)" class="text-xs opacity-75">${tool.cat} • ${tool.price}</p>
            <p style="color:var(--secondary)" class="text-xs opacity-50 mt-1">${tool.desc}</p>
          </div>
        </div>
        <div class="flex gap-2">
          <button class="delete-tool px-3 py-1.5 rounded text-xs font-medium" style="background:#dc2626;color:white" data-id="${tool.id}">Delete</button>
        </div>
      `;
      list.appendChild(toolEl);
    });
    
    document.querySelectorAll('.delete-tool').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        if (!id || !confirm('Delete this tool?')) return;
        try {
          await apiFetch(`/api/tools/${id}`, { method: 'DELETE' });
          showToast('Tool deleted');
          loadTools();
        } catch (err) {
          console.error(err);
          showToast('Unable to delete tool', false);
        }
      });
    });
  }

// Handle logo file upload
document.getElementById('toolLogo').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (event) => {
    logoDataUrl = event.target.result;
    const preview = document.getElementById('logoPreview');
    const img = document.getElementById('previewImg');
    img.src = logoDataUrl;
    preview.classList.remove('hidden');
  };
  reader.readAsDataURL(file);
});


// Form submission handler
document.getElementById('addToolForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const name = document.getElementById('toolName').value.trim();
  const price = document.getElementById('toolPrice').value.trim();
  const desc = document.getElementById('toolDesc').value.trim();
  const cat = document.getElementById('toolCategory').value;
  const rating = parseFloat(document.getElementById('toolRating').value);
  const icon = document.getElementById('toolIcon').value.trim();
  const featuresText = document.getElementById('toolFeatures').value;
  
  const features = featuresText.split('\n').map(f => f.trim()).filter(f => f);
  
  if (!name || !price || !desc || !cat || !rating || !icon || features.length === 0 || !logoDataUrl) {
    showToast('Please fill in all fields including logo', false);
    return;
  }
  
  const newTool = {
    name,
    price,
    desc,
    cat,
    rating,
    icon,
    features,
    logo: logoDataUrl
  };

  if (cat === 'Numbers') {
    const mapping = {};
    document.querySelectorAll('#countryPricesContainer input[data-code]').forEach(inp => {
      const v = inp.value.trim();
      if (v) mapping[inp.dataset.code] = v;
    });
    newTool.price_by_country = mapping;
  }

  try {
    await apiFetch('/api/tools', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(newTool)
    });
    document.getElementById('addToolForm').reset();
    document.getElementById('logoPreview').classList.add('hidden');
    logoDataUrl = '';
    showToast('Tool added successfully');
    loadTools();
  } catch (error) {
    console.error(error);
    showToast('Failed to add tool', false);
  }
});

// Back button handler
document.getElementById('backFromAdminBtn').addEventListener('click', () => {
  window.location.href = 'https://nexusdigital-mbwb.onrender.com';
});

// Initialize on load
document.addEventListener('DOMContentLoaded', () => {
  loadTools();
  lucide.createIcons();

  const cat = document.getElementById('toolCategory');
  if (cat) {
    cat.addEventListener('change', (e) => {
      const sec = document.getElementById('countryPriceSection');
      if (e.target.value === 'Numbers') {
        sec.classList.remove('hidden');
        populateCountryPriceEditor();
      } else {
        sec.classList.add('hidden');
      }
    });
  }
});
</script>

</body>
</html>
